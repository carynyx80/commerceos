[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 500
via_ir = false
evm_version = "cancun"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read-write", path = "../packages/blockchain/deployments" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
local = "http://127.0.0.1:8545"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
robinhood = "https://rpc.mainnet.chain.robinhood.com"
